<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>AgentLedger — Runtime Trust Layer for AI Agents</title>
<meta name="description" content="Interactive demo of the AgentLedger SDK — allow, policy block, kill switch, and chain verification, in one terminal." />

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

<script id="tailwind-config">
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          primary: '#4ddbd3',
          'primary-container': '#1abcb5',
          'primary-fixed': '#6ff7ef',
          'on-primary': '#003735',
          background: '#00142a',
          'on-background': '#d2e4ff',
          surface: '#00142a',
          'surface-container-low': '#081c32',
          'on-surface': '#d2e4ff',
          'on-surface-variant': '#bbc9c7',
          'outline-variant': '#3c4948',
          error: '#ffb4ab',
          warning: '#FFB347',
          'terminal-bg': '#081728',
        },
        borderRadius: { DEFAULT: '0.125rem', lg: '0.25rem', xl: '0.5rem', full: '0.75rem' },
        fontFamily: {
          body: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
        },
        fontSize: {
          'body-base': ['14px', { lineHeight: '22px', letterSpacing: '-0.005em', fontWeight: '400' }],
          'terminal-mono': ['13px', { lineHeight: '20px', letterSpacing: '0', fontWeight: '400' }],
          'headline-md': ['20px', { lineHeight: '28px', letterSpacing: '-0.015em', fontWeight: '600' }],
          'display-lg': ['32px', { lineHeight: '40px', letterSpacing: '-0.02em', fontWeight: '700' }],
          'label-caps': ['11px', { lineHeight: '14px', letterSpacing: '0.08em', fontWeight: '700' }],
        },
      },
    },
  };
</script>

<style>
  body {
    background-color: #00142a;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .font-mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .glow-line {
    box-shadow: 0 0 10px rgba(26, 188, 181, 0.5);
  }
  .pulse-chain {
    animation: pulse-green 1s ease-in-out infinite alternate;
    animation-delay: 11s;
  }
  @keyframes pulse-green {
    0%   { border-color: #1E3D5F; box-shadow: none; }
    100% { border-color: #4ddbd3; box-shadow: 0 0 15px rgba(77, 219, 211, 0.4); }
  }
  .caret {
    display: inline-block;
    width: 8px;
    height: 15px;
    background-color: #4ddbd3;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .log-response {
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .log-response.shown { opacity: 1; }
</style>
</head>

<body class="text-on-surface min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary">

  <!-- Header -->
  <header class="w-full flex flex-col items-center justify-center pt-8 pb-6 shrink-0">
    <h1 class="text-[#4ddbd3] tracking-tight mb-6 text-center text-3xl font-bold">
      AgentLedger
      <span class="text-on-surface-variant text-xl font-normal">— runtime trust layer for AI agents</span>
    </h1>

    <!-- Audit chain -->
    <div class="flex items-center gap-4 relative">
      <div class="absolute h-[1px] bg-primary/30 w-[80%] left-[10%] top-1/2 -translate-y-1/2 -z-10 glow-line"></div>
      <div class="chain-block bg-[#122D4B] border border-outline-variant rounded px-3 py-1 font-mono text-[13px] text-primary flex items-center gap-2 pulse-chain">
        <span class="material-symbols-outlined text-[14px]">link</span> 0x7A…F1
      </div>
      <div class="chain-block bg-[#122D4B] border border-outline-variant rounded px-3 py-1 font-mono text-[13px] text-primary flex items-center gap-2 pulse-chain" style="animation-delay: 11.2s">
        <span class="material-symbols-outlined text-[14px]">link</span> 0xB3…9C
      </div>
      <div class="chain-block bg-[#122D4B] border border-outline-variant rounded px-3 py-1 font-mono text-[13px] text-primary flex items-center gap-2 pulse-chain" style="animation-delay: 11.4s">
        <span class="material-symbols-outlined text-[14px]">link</span> 0x92…E4
      </div>
      <div class="chain-block bg-[#122D4B] border border-outline-variant rounded px-3 py-1 font-mono text-[13px] text-primary flex items-center gap-2 pulse-chain" style="animation-delay: 11.6s">
        <span class="material-symbols-outlined text-[14px]">link</span> 0x2F…A9
      </div>
    </div>
  </header>

  <!-- Terminal card — fixed height so it screenshots cleanly even mid-animation -->
  <main class="flex justify-center px-8 pb-8 w-full max-w-5xl mx-auto">
    <div class="w-full bg-terminal-bg border border-outline-variant rounded-lg shadow-2xl flex flex-col overflow-hidden" style="height: 360px;">
      <!-- Terminal title bar -->
      <div class="h-8 border-b border-outline-variant flex items-center px-4 justify-between bg-surface-container-low shrink-0">
        <div class="flex gap-2">
          <div class="w-3 h-3 rounded-full border border-outline-variant bg-[#1E3D5F]"></div>
          <div class="w-3 h-3 rounded-full border border-outline-variant bg-[#1E3D5F]"></div>
          <div class="w-3 h-3 rounded-full border border-outline-variant bg-[#1E3D5F]"></div>
        </div>
        <div class="font-mono text-[11px] tracking-wider text-on-surface-variant flex items-center gap-2">
          <span class="material-symbols-outlined text-[14px]">terminal</span>
          audit_trail.ndjson
        </div>
        <div class="w-12"></div>
      </div>
      <!-- Terminal output area -->
      <div class="flex-grow p-6 overflow-y-auto font-mono text-[13px] leading-relaxed" id="terminal-output"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-4 border-t border-outline-variant flex justify-between items-center px-8 shrink-0 bg-background">
    <div class="font-mono text-[11px] tracking-widest text-primary font-bold">AGENTLEDGER</div>
    <div class="font-mono text-[13px] text-on-surface-variant flex items-center gap-2">
      <span class="material-symbols-outlined text-[16px]">code</span>
      github.com/Esammy/AgentLedgerSDK
    </div>
  </footer>

<script>
  const script = [
    {
      prompt:   'root@agentledger:~# create_payment({ vendor: "Stripe", amount: $250 })',
      response: '<span class="text-primary-fixed">✓ ALLOW</span> <span class="text-on-surface-variant">· risk 35/100 · entry appended</span>',
      typeDelay: 45, lineDelay: 700,
    },
    {
      prompt:   'root@agentledger:~# create_payment({ vendor: "Unknown", amount: $12,500 })',
      response: '<span class="text-error">✗ BLOCKED</span> <span class="text-on-surface-variant">· policy: no_spend_over($500) · </span><span class="text-error">risk 100/100</span>',
      typeDelay: 35, lineDelay: 900,
    },
    {
      prompt:   'root@agentledger:~# ledger.killSwitch("run-prod")',
      response: '<span class="text-warning">⚡ HALTED</span> <span class="text-on-surface-variant">· all tool calls rejected in &lt;50ms</span>',
      typeDelay: 55, lineDelay: 1100,
    },
    {
      prompt:   'root@agentledger:~# ledger.verify("run-prod")',
      response: '<span class="text-primary-fixed">✓ Chain intact</span> <span class="text-on-surface-variant">— tamper-evident audit trail verified</span>',
      typeDelay: 45, lineDelay: 1400,
    },
  ];

  const terminal = document.getElementById('terminal-output');
  const params = new URLSearchParams(window.location.search);
  const INSTANT = params.has('instant'); // ?instant=1 — skip animation, render final state immediately

  function appendPromptLine(text, withCaret) {
    const div = document.createElement('div');
    div.className = 'mb-1';
    div.innerHTML = text + (withCaret ? '<span class="caret"></span>' : '');
    terminal.appendChild(div);
    return div;
  }

  function appendResponseLine(html, shown) {
    const div = document.createElement('div');
    div.className = 'pl-4 mb-4 log-response' + (shown ? ' shown' : '');
    div.innerHTML = html;
    terminal.appendChild(div);
    return div;
  }

  async function typeInto(element, text, speed) {
    return new Promise(resolve => {
      let i = 0;
      element.innerHTML = '';
      const content = document.createElement('span');
      element.appendChild(content);
      const caret = document.createElement('span');
      caret.className = 'caret';
      element.appendChild(caret);
      (function type() {
        if (i < text.length) {
          content.innerHTML += text.charAt(i++);
          setTimeout(type, speed);
        } else {
          caret.remove();
          resolve();
        }
      })();
    });
  }

  async function runAnimated() {
    await new Promise(r => setTimeout(r, 800));
    for (const line of script) {
      const promptDiv = appendPromptLine('', false);
      await typeInto(promptDiv, line.prompt, line.typeDelay);
      const responseDiv = appendResponseLine(line.response, false);
      await new Promise(r => setTimeout(r, 200));
      responseDiv.classList.add('shown');
      terminal.scrollTop = terminal.scrollHeight;
      await new Promise(r => setTimeout(r, line.lineDelay));
    }
    appendPromptLine('root@agentledger:~# ', true);
    terminal.scrollTop = terminal.scrollHeight;
  }

  function renderInstant() {
    for (const line of script) {
      appendPromptLine(line.prompt, false);
      appendResponseLine(line.response, true);
    }
    appendPromptLine('root@agentledger:~# ', true);
  }

  if (INSTANT) renderInstant();
  else runAnimated();
</script>

</body>
</html>
